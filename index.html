<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f4ee" />
  <title>Daily American English</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">Everyday American English</p>
    <h1>Daily American English</h1>
    <p class="subtitle">面向中文母语学习者的自然当代美式英语课程 · 中英对照 · 场景化学习</p>
  </header>

  <div class="page-shell">
    <section class="toolbar">
      <label class="search-wrap">
        <span class="sr-only">搜索课程内容</span>
        <input id="searchInput" type="search" placeholder="搜索单词、表达、场景或中文释义…" autocomplete="off" />
      </label>
    </section>

    <div class="course-layout">
      <aside class="course-sidebar">
        <div class="sidebar-title">课程目录</div>
        <nav id="curriculumNav" aria-label="课程目录"></nav>
      </aside>

      <main id="app" aria-live="polite">
        <div class="loading">正在加载课程…</div>
      </main>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
